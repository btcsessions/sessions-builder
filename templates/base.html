<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YouTube Planner{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}" class="nav-brand">YT Planner</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('settings_page') }}">Settings</a>
        <button id="update-app-btn" class="btn small nav-update-btn" title="Check for app updates">Update App</button>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
    <script>
    const updateBtn = document.getElementById("update-app-btn");
    updateBtn.addEventListener("click", async () => {
        updateBtn.disabled = true;
        updateBtn.textContent = "Checking...";
        try {
            const resp = await fetch("/api/update", { method: "POST" });
            const data = await resp.json();
            if (data.error) {
                alert("Update failed: " + data.error);
            } else if (data.updated) {
                alert("App updated! Restart the app to apply changes.");
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert("Update failed: " + err.message);
        }
        updateBtn.disabled = false;
        updateBtn.textContent = "Update App";
    });
    </script>
</body>
</html>
